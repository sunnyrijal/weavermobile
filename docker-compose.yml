version: '3.8'

services:
  # Next.js application
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contacts-app
    ports:
      - "9002:9002"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb+srv://rijalboy94:kvPfojAOpzITixtP@studiocontacts.t1x8fae.mongodb.net/contacts
    networks:
      - mongodb-network
    depends_on:
      - mongodb
    restart: unless-stopped

  # MongoDB database
  mongodb:
    image: mongo:latest
    container_name: contacts-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db
      - ./src/scripts/docker-seed.js:/app/src/scripts/docker-seed.js
      - ./seed-mongo.js:/seed-mongo.js
    command: ["mongod", "--bind_ip_all", "--auth"]
    networks:
      - mongodb-network
    restart: unless-stopped

  # MongoDB seeder (separate service for seeding)
  mongodb-seeder:
    image: node:20-alpine
    container_name: mongodb-seeder
    volumes:
      - ./src/scripts/docker-seed.js:/app/seed.js
    working_dir: /app
    command: sh -c "echo 'Waiting for MongoDB to start...' && sleep 10 && node seed.js"
    environment:
      -  MONGODB_URI=mongodb+srv://rijalboy94:kvPfojAOpzITixtP@studiocontacts.t1x8fae.mongodb.net/contacts
    networks:
      - mongodb-network
    depends_on:
      - mongodb

  # MongoDB Express web interface
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - mongodb-network
    depends_on:
      - mongodb



volumes:
  mongodb_data: 

networks:
  mongodb-network:
    driver: bridge