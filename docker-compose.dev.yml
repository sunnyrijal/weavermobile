version: '3.8'

services:
  # Next.js development server
  nextjs-dev:
    image: node:20-alpine
    container_name: contacts-app-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "9002:9002"  # Match the port in package.json
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contacts?authSource=admin
    command: npm install next react react-dom && npm run dev
    networks:
      - mongodb-network
    depends_on:
      - mongodb
    restart: unless-stopped

  # MongoDB database
  mongodb:
    image: mongo:latest
    container_name: contacts-mongodb-dev
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data_dev:/data/db
      - ./src/scripts/docker-seed.js:/app/src/scripts/docker-seed.js
    command: ["mongod", "--bind_ip_all", "--auth"]
    networks:
      - mongodb-network
    restart: unless-stopped

  # MongoDB seeder (separate service for seeding)
  mongodb-seeder:
    image: node:20-alpine
    container_name: mongodb-seeder-dev
    volumes:
      - ./src/scripts/docker-seed.js:/app/seed.js
    working_dir: /app
    command: sh -c "echo 'Waiting for MongoDB to start...' && sleep 10 && node seed.js"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/contacts?authSource=admin
    networks:
      - mongodb-network
    depends_on:
      - mongodb

  # MongoDB Express web interface
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb
    networks:
      - mongodb-network
    depends_on:
      - mongodb
  

volumes:
  mongodb_data_dev: 

networks:
  mongodb-network:
    driver: bridge 